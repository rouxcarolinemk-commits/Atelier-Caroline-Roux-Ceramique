<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c5b7a4"/>
      <stop offset="100%" stop-color="#7a6a59"/>
    </linearGradient>
    <filter id="noise">
      <feTurbulence baseFrequency=".7" numOctaves="3" stitchTiles="stitch" type="fractalNoise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .12"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1200" fill="url(#g)"/>
  <rect width="1600" height="1200" filter="url(#noise)" opacity=".5"/>
  <text x="80" y="1100" fill="#fffdf8" font-family="Arial, sans-serif" font-size="34" letter-spacing="5">PHOTO — DÉTAIL</text>
</svg>